<button type="button" class="card product-card" [class.sold-out]="soldOut()" [disabled]="soldOut()" (click)="onClick()">
    <span class="product-card__icon">{{ icon() }}</span>
    <span class="product-card__name">{{ product().name }}</span>
    <span class="product-card__price">{{ product().price | euros }}</span>
    @if (soldOut()) {
        <span class="badge badge-danger">Hors stock</span>
    } @else if (available() <= 3) {
        <span class="badge badge-warning">Stock : {{ available() }}</span>
    } @else {
        <span class="badge">Stock : {{ available() }}</span>
    }
</button>
