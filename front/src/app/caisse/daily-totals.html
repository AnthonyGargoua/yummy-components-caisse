<div class="card daily-totals">
    <h2>📅 Recettes par jour</h2>

    <div class="daily-totals__list">
        @for (dayTotal of totals(); track dayTotal.day) {
            <div class="daily-totals__row" [class.today]="dayTotal.day === today">
                <div class="daily-totals__day">
                    <span class="daily-totals__date">{{ dayTotal.day | date: 'EEEE d MMMM' }}</span>
                    <span class="daily-totals__count">{{ dayTotal.orderCount }} note(s)</span>
                </div>
                <span class="daily-totals__total">{{ dayTotal.total | euros }}</span>
            </div>
        } @empty {
            <p class="note-empty">Aucune recette pour l'instant.</p>
        }
    </div>
</div>
