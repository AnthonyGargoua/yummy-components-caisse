<h1>Caisse</h1>

@for (category of categories; track category.code) {
    <section>
        <h2>{{ category.icon }} {{ category.label }}</h2>

        <div class="product-grid">
            @for (product of productsIn(category.code); track product.id) {
                <app-product-card
                        [product]="product"
                        [available]="note.availableStock(product)"
                        (picked)="note.addProduct($event)"
                />
            }
        </div>
    </section>

    <section>
        <h2>⭐ Formules</h2>
        <div class="product-grid">
            @for (formula of formulas(); track formula.id) {
                <button type="button" class="card" [disabled]="formulaDisabled(formula)" (click)="openPicker(formula)">
                    <span>{{ formula.name }}</span>
                    <span>{{ mainCategoryLabel(formula) }} + boisson + dessert</span>
                    <span>{{ formula.price | euros }}</span>
                </button>
            }
        </div>
    </section>
}

<app-note-panel />

@if (openFormula(); as formula) {
    <app-formula-picker
            [formula]="formula"
            [products]="products()"
            (confirmed)="onFormulaConfirmed(formula, $event)"
            (cancelled)="openFormula.set(null)"
    />
}
