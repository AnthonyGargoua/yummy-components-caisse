server.port=8080

# Base SQLite : le fichier yummy.db est créé dans le dossier depuis lequel on lance le serveur
spring.datasource.url=jdbc:sqlite:yummy.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite ne gère qu'un seul écrivain à la fois : une seule connexion suffit
spring.datasource.hikari.maximum-pool-size=1

# Le schéma est créé par la classe Database (au démarrage ou via POST /api/reset)
spring.sql.init.mode=never

# Renvoie le message des erreurs (ex. "Stock insuffisant...") dans le JSON de réponse
spring.web.error.include-message=always
